repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: uv run ruff check .
        language: system
        pass_filenames: false
        always_run: true

      - id: ruff-format
        name: Ruff format check
        entry: uv run ruff format --check .
        language: system
        pass_filenames: false
        always_run: true

      - id: migrations-check
        name: Check pending migrations
        entry: uv run python manage.py makemigrations --check --dry-run
        language: system
        pass_filenames: false
        always_run: true
