
name: CI

on:
  push:
    branches: [main, developer]
  pull_request:
    branches: [main, developer]

env:
  DJANGO_SECRET_KEY: ci-insecure-secret-key
  DJANGO_DEBUG: "False"
  POSTGRES_DB: desafiox
  POSTGRES_USER: desafiox
  POSTGRES_PASSWORD: ci_password
  POSTGRES_HOST: localhost
  POSTGRES_PORT: "5432"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Contract matches its generator
        run: |
          uv run python docs/api/gen_openapi.py
          git diff --exit-code -- docs/api/openapi.yaml

      - name: Validate contract
        run: uv run --with jsonschema python docs/api/validate_openapi.py docs/api/openapi.yaml

      - name: DBML matches the models
        run: |
          uv run python docs/modelagem/gen_dbml.py
          git diff --exit-code -- docs/modelagem/desafio-x.dbml

      - name: Audit dependencies
        run: |
          uv export --frozen --format requirements-txt --no-emit-project -o requirements-audit.txt
          uvx pip-audit -r requirements-audit.txt --disable-pip --require-hashes

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: desafiox
          POSTGRES_USER: desafiox
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U desafiox -d desafiox"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked

      - name: Display Python version
        run: uv run python -c "import sys; print(sys.version)"

      - name: Django system check
        run: uv run python manage.py check

      - name: Apply migrations
        run: uv run python manage.py migrate --noinput

      - name: Check missing migrations
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Deploy checklist
        env:
          DJANGO_ALLOWED_HOSTS: example.com
          # Longa de propósito: o check --deploy avisa (W009) de chave com menos de 50 caracteres.
          DJANGO_SECRET_KEY: ci-only-key-for-deploy-check-0123456789-abcdefghijklmnopqrstuvwxyz
        run: uv run python manage.py check --deploy --fail-level WARNING --settings=config.settings.production

      - name: Run tests
        run: uv run pytest --cov

  sonar:
    runs-on: ubuntu-latest
    needs: [lint, test]

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: desafiox
          POSTGRES_USER: desafiox
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U desafiox -d desafiox"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked

      - name: Apply migrations
        run: uv run python manage.py migrate --noinput

      - name: Testes com cobertura
        run: uv run pytest --cov --cov-report=xml

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # CD da homologação: push na main com lint e testes verdes atualiza a
  # instância Lightsail com este commit. Configuração: docs/deploy-lightsail.md, seção 4.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [lint, test]
    environment: homologacao
    timeout-minutes: 30
    concurrency:
      group: deploy-homologacao
      cancel-in-progress: false
    steps:
      - name: Chave SSH
        env:
          SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.LIGHTSAIL_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy
        env:
          HOST: ${{ secrets.LIGHTSAIL_HOST }}
        # O .env do servidor é ignorado pelo git: o checkout não o toca.
        run: |
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes "ubuntu@$HOST" "set -e
            cd /srv/desafiox/homolog/api  # a stack api já roda dessa pasta
            git fetch --quiet origin main
            git checkout --force -B main $GITHUB_SHA
            docker compose -f docker-compose.prod.yaml up -d --build --wait
            docker image prune -f"
