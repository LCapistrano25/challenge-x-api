    post:
      tags:
      - evaluations
      operationId: evaluationsCreateRectification
      summary: Retificar a nota de um critério
      description: |-
        **Status: PROPOSTO** — o contrato depende da decisão de P-21 e pode mudar.

        Altera os pontos de um critério de uma avaliação finalizada e grava o ajuste no histórico, que não pode ser alterado nem excluído.

        **Requisitos:** RF14

        **Autenticação:** obrigatória (sessão por cookie; POST, PUT, PATCH e DELETE exigem o cabeçalho X-CSRFToken).

        **Perfis permitidos:** ADMIN

        **Regras de negócio:**
        - Somente avaliação finalizada; o rascunho continua do professor.
        - Vale mesmo com o prazo de avaliação encerrado.
        - Justificativa obrigatória; new_points entre 0 e o máximo do critério e diferente do valor atual.
        - O critério precisa ter sido pontuado na avaliação (400 validation_error).
        - Edição encerrada não aceita ajuste, nem do administrador (RN33).
        - Recalcula a nota da etapa; a resposta traz o valor novo em stage_score.

        **Pendências relacionadas (api-pendencias.md):** P-21
      x-status: proposed
      x-requirements:
      - RF14
      x-roles:
      - ADMIN
      x-pendencias:
      - P-21
      parameters:
      - $ref: '#/components/parameters/EvaluationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RectificationWrite'
            example:
              stage_criterion_id: 51
              new_points: '1.50'
              reason: Erro de digitação do professor.
      responses:
        '201':
          description: Retificação registrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rectification'
              example:
                id: 9
                evaluation_id: 201
                stage_criterion_id: 51
                previous_points: '1.00'
                new_points: '1.50'
                reason: Erro de digitação do professor.
                rectified_by: 1
                rectified_at: '2026-11-18T21:30:00Z'
                stage_score:
                  value: '2.40'
                  evaluation_count: 2
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
