  /api/admin/editions/{edition_id}/results/calculate:
    post:
      tags:
      - results
      operationId: resultsCalculate
      summary: Calcular nota final e ranking
      description: |-
        Calcula e grava a nota final e a posição no curso de cada projeto da edição. Pode repetir até a homologação.

        **Requisitos:** RF15

        **Autenticação:** obrigatória (sessão por cookie; POST, PUT, PATCH e DELETE exigem o cabeçalho X-CSRFToken).

        **Perfis permitidos:** ADMIN

        **Regras de negócio:**
        - Nota final = soma das etapas de entrega pontuadas; o projeto só entra no ranking com todas elas DEFINITIVE ou ZERO_NO_SUBMISSION.
        - Fora do ranking: equipe ou projeto desclassificado, projeto sem desafio, nota pendente (lista em excluded). Equipe desfeita não aparece.
        - Desempate (Art. 24): critérios com tiebreak_order, na ordem; nota do critério em escala 0 a 10 por etapa, média dos professores, soma entre etapas.
        - Recalcular preserva os finalistas ainda classificados; quem sai do ranking perde nota, posição e a marca de finalista.
        - O sistema não calcula pontos do aluno na disciplina (D-04).

        **Pendências relacionadas (api-pendencias.md):** P-46
      x-status: confirmed
      x-requirements:
      - RF15
      x-roles:
      - ADMIN
      x-pendencias:
      - P-46
      parameters:
      - $ref: '#/components/parameters/EditionId'
