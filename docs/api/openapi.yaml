      - $ref: '#/components/parameters/EditionId'
      responses:
        '200':
          description: Operação concluída.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditionResults'
              example:
                edition_id: 3
                approved_at: null
                results:
                - project:
                    id: 40
                    title: Monitoramento inteligente do consumo de água
                  team:
                    id: 12
                    name: Equipe Aurora
                    code: DXA7K2
                  course:
                    id: 1
                    name: Engenharia de Software
                  category:
                    id: 2
                    name: Protótipos e Artefatos
                  final_score: '7.50'
                  course_rank: 1
                  finalist: true
                  category_rank: 1
                  award: 1
