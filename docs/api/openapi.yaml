  /api/teams/{team_id}/leave:
    post:
      tags:
      - teams
      operationId: teamsLeave
      summary: Sair da equipe
      description: |-
        Encerra o vínculo do próprio aluno (left_at preenchido, active=false), preservando o histórico.

        **Requisitos:** RF26

        **Autenticação:** obrigatória (sessão por cookie; POST, PUT, PATCH e DELETE exigem o cabeçalho X-CSRFToken).

        **Perfis permitidos:** STUDENT

        **Autorização adicional:** Somente o próprio integrante ativo.

        **Regras de negócio:**
        - Somente durante a formação; depois disso a composição é congelada.
        - O LEADER deve transferir a liderança antes (RF27), a não ser que esteja sozinho: aí a saída desfaz a equipe (status DISBANDED) e cancela os convites e as solicitações pendentes, avisando por notificação quem esperava resposta, e o aluno pode entrar em outra equipe.
        - Se o curso do desafio ficar sem representante, a seleção do desafio deve ser invalidada (P-25).
        - Se a saída deixa a equipe com algum integrante, mas abaixo do mínimo da edição, a API responde 409 leave_below_minimum até receber confirm true; os demais integrantes são avisados de quantos restaram.
        - Se a saída ocorre nas últimas 24 horas do prazo de formação e deixa a equipe abaixo do mínimo, a equipe ganha, uma única vez, 48 horas depois do fim do prazo (formation_extended_until) para convidar, receber solicitações e aceitar convites. Durante a janela extra ninguém sai.

        **Pendências relacionadas (api-pendencias.md):** P-25
      x-status: confirmed
      x-requirements:
      - RF26
      x-roles:
      - STUDENT
      x-pendencias:
      - P-25
      parameters:
      - $ref: '#/components/parameters/TeamId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamLeave'
            example:
              confirm: false
      responses:
        '204':
          description: Saída registrada.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Conflito com uma regra de negócio.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                formation_closed:
                  summary: O prazo de formação de equipes está encerrado.
                  value:
                    error:
                      code: formation_closed
                      message: O prazo de formação de equipes está encerrado.
                      details: null
                leader_must_transfer:
                  summary: Transfira a liderança antes de sair da equipe.
                  value:
                    error:
                      code: leader_must_transfer
                      message: Transfira a liderança antes de sair da equipe.
                      details: null
                leave_below_minimum:
                  summary: A saída deixa a equipe com algum integrante, mas abaixo do mínimo; reenvie com confirm true.
                  value:
                    error:
                      code: leave_below_minimum
                      message: A saída deixa a equipe com algum integrante, mas abaixo do mínimo; reenvie com confirm true.
                      details: null
