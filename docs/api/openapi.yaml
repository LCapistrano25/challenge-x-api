      operationId: teamsCreate
      summary: Criar equipe
      description: |-
        Cria uma equipe na edição vigente; o criador vira LEADER e o sistema gera o código da equipe.

        **Requisitos:** RF21

        **Autenticação:** obrigatória (sessão por cookie; POST, PUT, PATCH e DELETE exigem o cabeçalho X-CSRFToken).

        **Perfis permitidos:** STUDENT

        **Regras de negócio:**
        - A edição vigente é a edição com status PUBLISHED (P-41).
        - Somente durante o prazo da etapa FORMATION.
        - O aluno não pode estar em outra equipe ativa na edição.
        - Nome único na edição (equipe desfeita libera o nome).
        - A equipe não nasce só com o líder: o corpo traz de min_members - 1 a max_members - 1 convites (nunca menos de 1); fora disso, 400 team_invitations_required.
        - Equipe e convites são criados na mesma transação; um convite recusado por regra (aluno já em equipe, sem cadastro confirmado) desfaz a criação.

        **Pendências relacionadas (api-pendencias.md):** P-41
