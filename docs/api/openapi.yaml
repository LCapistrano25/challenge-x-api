openapi: 3.1.0
info:
  title: Projeto X (Desafio X) — API
  version: 0.1.0
  description: |-
    API REST da plataforma do Projeto X (Desafio X) da UniCatólica.

    Fonte de dados: DBML aprovado (nomes e enums em inglês). Os perfis são STUDENT, TEACHER, EXTERNAL_EVALUATOR e ADMIN (enum user_role).

    **Autenticação:** alunos e professores entram com a Microsoft; administradores e avaliadores externos, com e-mail e senha. Rotas protegidas usam Bearer JWT.

    **Convenções propostas (pendentes de aprovação):** formato de erro `Error` (P-37), paginação `page`/`page_size` (P-38), decimais como string (P-39).

    Cada operação informa o status (`x-status`: `confirmed` ou `proposed`), os requisitos (`x-requirements`), os perfis (`x-roles`) e as pendências (`x-pendencias`) registradas em api-pendencias.md. Operações `proposed` dependem de uma pendência de severidade alta.
servers:
- url: http://localhost:8000
  description: Ambiente local de desenvolvimento
security:
- bearerAuth: []
tags:
- name: auth
  description: Autenticação, sessões e autocadastro.
- name: accounts
  description: Gerenciamento administrativo de usuários e perfis.
- name: core
  description: Cursos e ODS.
- name: editions
  description: Edições, desafios, categorias, etapas, critérios e formulário final.
- name: teams
  description: Equipes, integrantes, convites, solicitações e observações.
- name: projects
  description: Projetos, entregas, versões e comprovantes.
- name: evaluations
  description: Avaliações acadêmicas, notas e avaliação final.
- name: results
  description: Certificados.
- name: support
  description: Chamados de correção cadastral.
- name: notifications
  description: Notificações do painel.
- name: public
  description: Painel público (sem autenticação).
paths:
  /api/admin/categories/{category_id}:
    patch:
      tags:
      - editions
      operationId: editionsUpdateCategory
      summary: Atualizar categoria
      description: |-
        Edita ou desativa a categoria.

        **Requisitos:** RF49

        **Autenticação:** obrigatória (Bearer JWT).

        **Perfis permitidos:** ADMIN
      x-status: confirmed
      x-requirements:
      - RF49
      x-roles:
      - ADMIN
      parameters:
      - $ref: '#/components/parameters/CategoryId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryUpdate'
            example:
              name: Protótipos e Artefatos
              description: Descrição revisada.
              active: false
      responses:
        '200':
          description: Operação concluída.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
              example:
                id: 2
                edition_id: 3
                name: Protótipos e Artefatos
                description: Categoria A do Art. 2 do regulamento.
                active: true
                created_at: '2026-10-22T16:00:00Z'
                updated_at: '2026-10-22T16:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Conflito com uma regra de negócio.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                category_name_taken:
                  summary: Já existe categoria com este nome na edição.
                  value:
                    error:
                      code: category_name_taken
                      message: Já existe categoria com este nome na edição.
                      details: null
                edition_closed:
                  summary: A edição está encerrada e não pode ser alterada.
                  value:
                    error:
                      code: edition_closed
                      message: A edição está encerrada e não pode ser alterada.
                      details: null
    delete:
      tags:
      - editions
      operationId: editionsDeleteCategory
      summary: Excluir categoria sem uso
      description: |-
        Exclui categoria não utilizada por projetos.

        **Requisitos:** RF49

        **Autenticação:** obrigatória (Bearer JWT).

        **Perfis permitidos:** ADMIN
      x-status: confirmed
      x-requirements:
      - RF49
      x-roles:
      - ADMIN
      parameters:
      - $ref: '#/components/parameters/CategoryId'
      responses:
        '204':
          description: Categoria excluída.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Conflito com uma regra de negócio.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                category_in_use:
                  summary: A categoria é usada por projetos e só pode ser desativada.
                  value:
                    error:
                      code: category_in_use
                      message: A categoria é usada por projetos e só pode ser desativada.
                      details: null
                edition_closed:
                  summary: A edição está encerrada e não pode ser alterada.
                  value:
                    error:
                      code: edition_closed
                      message: A edição está encerrada e não pode ser alterada.
                      details: null
