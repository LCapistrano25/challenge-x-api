    post:
      tags:
      - results
      operationId: resultsCalculateAwards
      summary: Calcular o pódio
      description: |-
        Calcula e grava o pódio: 1º a 3º por categoria na edição inteira, entre os finalistas (Art. 26, D-01). Pode repetir até a homologação.

        **Requisitos:** RF49

        **Autenticação:** obrigatória (sessão por cookie; POST, PUT, PATCH e DELETE exigem o cabeçalho X-CSRFToken).

        **Perfis permitidos:** ADMIN

        **Regras de negócio:**
        - Ordem: média das avaliações externas EVALUATED (soma das respostas de nota), depois final_score, depois os critérios do Art. 24; empate total divide a posição.
        - Finalista sem categoria ou sem avaliação externa finalizada fica sem posição (category_rank e award nulos).
        - Grava category_rank de todos os finalistas com posição e award (1 a 3) nos três primeiros de cada categoria.

        **Pendências relacionadas (api-pendencias.md):** P-30
      x-status: confirmed
      x-requirements:
