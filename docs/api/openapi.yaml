        Edita nome, descrição/faixas e posição de desempate.

        **Requisitos:** RF06

        **Autenticação:** obrigatória (sessão por cookie; POST, PUT, PATCH e DELETE exigem o cabeçalho X-CSRFToken).

        **Perfis permitidos:** ADMIN

        **Regras de negócio:**
        - Bloqueado enquanto houver avaliações em etapa que use o critério.
      x-status: confirmed
      x-requirements:
      - RF06
      x-roles:
      - ADMIN
      parameters:
      - $ref: '#/components/parameters/CriterionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CriterionUpdate'
            example:
              name: Inovação
              rubric: Faixas revisadas.
              tiebreak_order: null
      responses:
        '200':
          description: Operação concluída.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Criterion'
              example:
                id: 21
                edition_id: 3
                name: Inovação
                rubric: Avalia o grau de originalidade da solução...
                tiebreak_order: 1
                created_at: '2026-10-22T16:00:00Z'
                updated_at: '2026-10-22T16:00:00Z'
