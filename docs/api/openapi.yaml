  /api/teams/{team_id}/project/options:
    get:
      tags:
      - projects
      operationId: projectsGetOptions
      summary: Desafios e categorias elegíveis
      description: |-
        Lista os desafios ativos dos cursos dos integrantes ativos e as categorias ativas da edição.

        **Requisitos:** RF29, RF50

        **Autenticação:** obrigatória (Bearer JWT).

        **Perfis permitidos:** STUDENT

        **Autorização adicional:** Integrante ativo da equipe.
      x-status: confirmed
      x-requirements:
      - RF29
      - RF50
      x-roles:
      - STUDENT
      parameters:
      - $ref: '#/components/parameters/TeamId'
      responses:
        '200':
          description: Operação concluída.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectOptions'
              example:
                challenges:
                - id: 15
                  title: Uso eficiente de recursos hídricos no campus
                  description: Propor uma solução para reduzir o desperdício de água nas instalações da universidade.
                  course:
                    id: 1
                    name: Engenharia de Software
                    slug: ES
                  sdg:
                    id: 9
                    number: 9
                    title: Indústria, Inovação e Infraestrutura
                categories:
                - id: 2
                  name: Protótipos e Artefatos
                  description: Categoria A do Art. 2.
