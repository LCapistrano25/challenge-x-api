      - auth
      operationId: authCreateMicrosoftSession
      summary: Autenticar aluno ou professor com a Microsoft
      description: |-
        Troca o authorization code da Microsoft por um JWT da aplicação. A troca do código e a consulta ao Microsoft Graph ocorrem no backend.

        **Requisitos:** RF18, RF36

        **Autenticação:** pública (não exige token).

        **Perfis permitidos:** qualquer visitante

        **Regras de negócio:**
        - Domínio @a.catolica-to.edu.br define o perfil STUDENT; @p.catolica-to.edu.br define TEACHER. Outros domínios são rejeitados (403).
        - No primeiro acesso, cria users e accounts (provider MICROSOFT, provider_account_id = identidade Microsoft), sem criar student/teacher.
        - Se o e-mail já estiver vinculado a outra identidade Microsoft, a autenticação é recusada (409).
        - Usuários inativos não recebem sessão (403).
        - profile_completed=false indica que o frontend deve conduzir ao autocadastro (RF19) ou à configuração do professor (RF36.1).
        - Expiração do token pendente (P-03).

        **Pendências relacionadas (api-pendencias.md):** P-02, P-03, P-42
      x-status: confirmed
      x-requirements:
      - RF18
