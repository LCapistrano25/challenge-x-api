  /api/auth/sessions/microsoft:
    post:
      tags:
      - auth
      operationId: authCreateMicrosoftSession
      summary: Autenticar aluno ou professor com a Microsoft
      description: |-
        Troca o authorization code da Microsoft pela identidade do usuário e cria a sessão (cookie), como o login com senha. A troca do código ocorre no backend, com o client secret do app (plataforma Web no Entra ID). Exige o cabeçalho X-CSRFToken, obtido em GET /api/auth/csrf.

        **Requisitos:** RF18, RF36

        **Autenticação:** pública (não exige sessão).

        **Perfis permitidos:** qualquer visitante

        **Regras de negócio:**
        - Só contas do tenant da instituição são aceitas; código inválido, expirado, já usado ou de outro tenant retorna 401 invalid_credentials.
        - Domínio @a.catolica-to.edu.br define o perfil STUDENT; @p.catolica-to.edu.br define TEACHER. Outros domínios são rejeitados (403 domain_role_mismatch).
        - No primeiro acesso, cria o usuário com a identidade Microsoft (oid), sem senha e sem criar student/teacher. Usuário já cadastrado com o mesmo e-mail (ex.: professor criado pelo administrador) é vinculado à identidade.
        - Se o e-mail já estiver vinculado a outra identidade Microsoft, a autenticação é recusada (409).
        - Usuários inativos não recebem sessão (403 inactive_account).
        - profile_completed=false indica que o frontend deve conduzir ao autocadastro (RF19) ou à configuração do professor (RF36.1).
        - Microsoft indisponível ou login não configurado: 503 external_service_error.
        - A sessão expira após 30 minutos de inatividade, renovados a cada requisição (P-03).

        **Pendências relacionadas (api-pendencias.md):** P-02, P-03, P-42
      x-status: confirmed
      x-requirements:
      - RF18
      - RF36
      x-roles: []
      x-pendencias:
      - P-02
      - P-03
      - P-42
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MicrosoftSessionRequest'
            example:
              code: 0.AQ8A3x...
      responses:
        '200':
          description: Sessão criada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MicrosoftSessionResponse'
              example:
                user_id: 42
                name: Ana Ribeiro
                email: ana@a.catolica-to.edu.br
                role: STUDENT
                profile_completed: false
        '400':
