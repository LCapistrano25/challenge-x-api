  /api/projects/{project_id}/stages/{stage_id}/versions:
    post:
      tags:
      - projects
      operationId: projectsSubmitDeliverableVersion
      summary: Enviar ou atualizar entrega da etapa
      description: |-
        Registra nova versão imutável da entrega e gera o comprovante. A confirmação prévia é responsabilidade do frontend.

        **Requisitos:** RF31

        **Autenticação:** obrigatória (sessão por cookie; POST, PUT, PATCH e DELETE exigem o cabeçalho X-CSRFToken).

        **Perfis permitidos:** STUDENT

        **Autorização adicional:** O usuário deve ser o LEADER ativo da equipe.

        **Regras de negócio:**
        - Somente dentro do prazo da etapa, incluindo a prorrogação da equipe (409 stage_deadline_closed); antes do início, 409 stage_not_open.
        - Todos os campos obrigatórios (LINK, FILE, CANVAS e SWOT) respondidos, sem repetir, cada item com o tipo do seu campo (400 validation_error).
        - Canvas: um texto não vazio, de até 5000 caracteres, nos nove blocos. SWOT: de 1 a 20 textos não vazios, de até 5000 caracteres, em cada quadrante. Chave desconhecida ou bloco vazio é 400 validation_error (P-47).
        - Arquivo: extensão permitida pelos formatos do campo (400 file_format_not_allowed), até o tamanho máximo do campo e do servidor (400 file_too_large), não vazio e com conteúdo que combine com a extensão. Executáveis e scripts nunca entram.
        - JSON aceita links, canvas e SWOT. Arquivos exigem multipart/form-data: `items` em string JSON, com `file_index` apontando para `files[]`; arquivo sobrando ou índice inexistente é 400.
        - Os arquivos ficam em armazenamento privado, sem URL pública; o download é por GET /api/deliverable-items/{item_id}/file.
        - O projeto precisa ter desafio, categoria, título e resumo (400 validation_error; D-06).
        - Cada envio cria number sequencial; versões anteriores são preservadas.
        - Equipe desclassificada ou incompleta não envia (P-23).

        **Pendências relacionadas (api-pendencias.md):** P-23, P-43, P-47
      x-status: confirmed
      x-requirements:
      - RF31
      x-roles:
      - STUDENT
      x-pendencias:
      - P-23
      - P-43
      - P-47
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/StageId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeliverableSubmission'
            example:
              items:
              - field_id: 31
                link: https://github.com/equipe/projeto
              notes: Correção do relatório.
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DeliverableSubmissionMultipart'
      responses:
        '201':
          description: Versão registrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliverableVersion'
              example:
                id: 77
                number: 2
                submitted_by:
                  user_id: 42
                  name: Maria Souza
                submitted_at: '2026-10-22T16:00:00Z'
                notes: Correção do relatório.
                items:
                - id: 301
                  field_id: 31
                  type: LINK
                  link: null
                  file_url: /api/deliverable-items/301/file
                  file_name: relatorio.pdf
                  size_bytes: 1048576
                  content:
                    customer_segments: Texto do bloco.
                    value_propositions: Texto do bloco.
                    channels: Texto do bloco.
                    customer_relationships: Texto do bloco.
                    revenue_streams: Texto do bloco.
                    key_resources: Texto do bloco.
                    key_activities: Texto do bloco.
                    key_partnerships: Texto do bloco.
                    cost_structure: Texto do bloco.
                receipt:
                  verification_code: 3f2b8c1e9a7d4f60b5c2e1d0a9f8b7c6
                  file_url: null
                  generated_at: '2026-10-22T16:00:00Z'
        '400':
