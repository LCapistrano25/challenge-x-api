  responses:
    BadRequest:
      description: 'Requisição inválida: dados inválidos (`validation_error`), JSON malformado (`parse_error`) ou corpo acima
        de 2,5 MB, o `DATA_UPLOAD_MAX_MEMORY_SIZE` (`request_too_large`).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            validation_error:
              value:
                error:
                  code: validation_error
                  message: Dados inválidos.
                  details:
                    title:
                    - Este campo é obrigatório.
            parse_error:
              value:
                error:
                  code: parse_error
                  message: O corpo contém JSON inválido.
                  details: null
            request_too_large:
              value:
                error:
                  code: request_too_large
                  message: A requisição excede o tamanho permitido.
                  details: null
    Unauthorized:
      description: Autenticação ausente, inválida ou expirada.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
